name: drift
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SA }}
      - uses: hashicorp/setup-terraform@v3
      - name: Detect drift
        run: |
          cd infra/terraform/envs/${{ matrix.env }}
          terraform init -input=false -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" -backend-config="prefix=agent/${{ matrix.env }}"
          code=0
          terraform plan -input=false -detailed-exitcode -no-color || code=$?
          if [ "$code" -eq 2 ]; then echo "::error::Drift detected in ${{ matrix.env }}"; exit 1; fi
          exit "$code"
